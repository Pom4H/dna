name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Verify runtime
        run: |
          test "$(bun --version)" = "$(cat .bun-version)"
          bun --version
      - name: Install locked development tools
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Show compiler version
        run: bun run typecheck --version
      - name: Typecheck, tests, ESM build, CLI and IR
        run: bun run verify
      - name: Coverage
        run: bun run test:coverage
      - name: Verify lockfile remains unchanged
        run: git diff --exit-code -- bun.lock
      - name: Keep model IR and scenario reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dna-verification
          path: reports/
          if-no-files-found: warn
